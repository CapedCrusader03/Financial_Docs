services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: filings
      POSTGRES_USER: filings
      POSTGRES_PASSWORD: filings
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
volumes:
  postgres_data:
